<body>
    <!-- Поисковая панель -->
    <div class="address-search-container">
        <div class="address-search-input-wrapper">
            <input type="text" 
                id="address-search" 
                class="address-search-input"
                placeholder="Введите адрес"
                autocomplete="off">
            <div id="address-search-suggestions" class="address-search-suggestions"></div>
        </div>
        <button onclick="searchAddress()" 
            class="address-search-button">
            Найти
        </button>
    </div>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Легенда -->
    <div class="legend">
        <div class="legend-panel-header" onclick="toggleLegendPanel()">
            <div class="legend-map-title">Участок</div>
            <span class="legend-panel-arrow">▼</span>
        </div>
        <div class="legend-body">
        <div class="legend-section">
            <div class="legend-single-color">
                <div class="legend-color-indicator" id="parcel-color-indicator" style="background-color: #1c32bd;"></div>
                <div class="legend-title">parcel</div>
                <label class="layer-toggle">
                    <input type="checkbox" id="parcel-toggle" checked onchange="toggleLayer('parcel-layer', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="legend-loader" id="parcel-loader">
                <div class="legend-loader-spinner"></div>
                <span class="legend-loader-text">Загрузка данных...</span>
            </div>
        </div>
        </div>
    </div>
    
    <script>
        // =========================================================================
        // Утилиты
        // =========================================================================
        
        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'М';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'К';
            }
            return Math.round(num).toLocaleString('ru-RU');
        }
        
        // Функция debounce для ограничения частоты запросов
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // Открытие Яндекс.Карт
        function openYandexMaps(lon, lat) {

let currentSearchCoords = null; // [lon, lat]
let searchMarkerOverlayEl = null;
let searchPopupOverlayEl = null;

function updateSearchMarkerPosition() {
    if (!isComparisonMode || !currentSearchCoords) return;

    const overlay = document.getElementById('search-markers-overlay');
    const markerEl = document.getElementById('search-marker-overlay');
    const popupEl = document.getElementById('search-popup-overlay');

    if (!overlay || !markerEl || !mapBefore) return;

    const [lon, lat] = currentSearchCoords;
    const point = mapBefore.project([lon, lat]);
    const mapContainer = mapBefore.getContainer();
    const mapRect = mapContainer.getBoundingClientRect();
    const overlayRect = overlay.getBoundingClientRect();

    const left = point.x + (mapRect.left - overlayRect.left);
    const top = point.y + (mapRect.top - overlayRect.top);

    markerEl.style.left = left + 'px';
    markerEl.style.top = top + 'px';

    if (popupEl) {
        popupEl.style.left = left + 'px';
        popupEl.style.top = (top - 35) + 'px';
    }
}

function getSearchMode() {
    return (searchConfig && searchConfig.search_mode) ? searchConfig.search_mode : 'geocoder';
}

function isGeojsonSearchMode() {
    return getSearchMode() === 'geojson';
}

function getSearchLayers() {
    if (searchConfig && Array.isArray(searchConfig.search_layers) && searchConfig.search_layers.length > 0) {
        return searchConfig.search_layers;
    }
    if (mapConfig && mapConfig.layers) {
        return Object.keys(mapConfig.layers);
    }
    return [];
}

function getSearchFields() {
    if (searchConfig && Array.isArray(searchConfig.search_fields)) {
        return searchConfig.search_fields;
    }
    return [];
}

function getMaxResults() {
    if (searchConfig && Number.isFinite(searchConfig.max_results)) {
        return Math.max(1, searchConfig.max_results);
    }
    return 5;
}

function getZoomOnResult() {
    if (searchConfig && Number.isFinite(searchConfig.zoom_on_result)) {
        return searchConfig.zoom_on_result;
    }
    return 15;
}

function getPrimaryMapForSearch() {
    if (isComparisonMode) return mapBefore || mapAfter;
    return map;
}

function getLayerSourceData(targetMap, layerName) {
    if (!targetMap) return null;
    const source = targetMap.getSource(layerName);
    if (!source) return null;

    if (source._data && source._data.type === 'FeatureCollection') {
        return source._data;
    }

    if (typeof source.serialize === 'function') {
        const serialized = source.serialize();
        if (serialized && serialized.data && serialized.data.type === 'FeatureCollection') {
            return serialized.data;
        }
    }

    return null;
}

function collectGeometryCoords(geometry, out) {
    if (!geometry || !geometry.type) return;

    const walk = (node) => {
        if (!Array.isArray(node)) return;
        if (node.length >= 2 && typeof node[0] === 'number' && typeof node[1] === 'number') {
            out.push([node[0], node[1]]);
            return;
        }
        node.forEach(walk);
    };

    walk(geometry.coordinates);
}

function getFeatureCenter(feature) {
    if (!feature || !feature.geometry) return null;

    const points = [];
    collectGeometryCoords(feature.geometry, points);
    if (!points.length) return null;

    let minLon = points[0][0];
    let maxLon = points[0][0];
    let minLat = points[0][1];
    let maxLat = points[0][1];

    for (let i = 1; i < points.length; i += 1) {
        const [lon, lat] = points[i];
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
    }

    return [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
}

function findGeojsonMatches(query, limit = null) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];

    const fields = getSearchFields();
    if (!fields.length) return [];

    const targetMap = getPrimaryMapForSearch();
    if (!targetMap) return [];

    const layers = getSearchLayers();
    const maxResults = limit || getMaxResults();
    const results = [];

    for (const layerName of layers) {
        const data = getLayerSourceData(targetMap, layerName);
        if (!data || !Array.isArray(data.features)) continue;

        for (const feature of data.features) {
            const props = feature && feature.properties ? feature.properties : {};

            for (const fieldName of fields) {
                const rawValue = props[fieldName];
                if (rawValue === undefined || rawValue === null) continue;

                const valueText = String(rawValue);
                if (!valueText.toLowerCase().includes(q)) continue;

                const coords = getFeatureCenter(feature);
                if (!coords) continue;

                results.push({
                    layerName,
                    fieldName,
                    valueText,
                    coords,
                    feature,
                    displayText: valueText,
                });

                if (results.length >= maxResults) {
                    return results;
                }

                break;
            }
        }
    }

    return results;
}

function getFeatureBounds(feature) {
    if (!feature || !feature.geometry) return null;

    const points = [];
    collectGeometryCoords(feature.geometry, points);
    if (!points.length) return null;

    let minLon = points[0][0];
    let maxLon = points[0][0];
    let minLat = points[0][1];
    let maxLat = points[0][1];

    for (let i = 1; i < points.length; i += 1) {
        const [lon, lat] = points[i];
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
    }

    return [
        [minLon, minLat],
        [maxLon, maxLat],
    ];
}

function isPolygonFeature(feature) {
    if (!feature || !feature.geometry || !feature.geometry.type) return false;
    const t = feature.geometry.type;
    return t === 'Polygon' || t === 'MultiPolygon';
}

const SEARCH_HIGHLIGHT_SOURCE_ID = 'wibemaps-search-highlight-source';
const SEARCH_HIGHLIGHT_FILL_ID = 'wibemaps-search-highlight-fill';
const SEARCH_HIGHLIGHT_LINE_ID = 'wibemaps-search-highlight-line';

function ensureSearchHighlightLayers(targetMap) {
    if (!targetMap || targetMap.getSource(SEARCH_HIGHLIGHT_SOURCE_ID)) return;

    targetMap.addSource(SEARCH_HIGHLIGHT_SOURCE_ID, {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
    });

    targetMap.addLayer({
        id: SEARCH_HIGHLIGHT_FILL_ID,
        type: 'fill',
        source: SEARCH_HIGHLIGHT_SOURCE_ID,
        paint: {
            'fill-color': '#ffd400',
            'fill-opacity': 0.28,
        },
    });

    targetMap.addLayer({
        id: SEARCH_HIGHLIGHT_LINE_ID,
        type: 'line',
        source: SEARCH_HIGHLIGHT_SOURCE_ID,
        paint: {
            'line-color': '#ffd400',
            'line-width': 3.5,
        },
    });
}

function clearSearchHighlight(targetMap) {
    if (!targetMap) return;
    const source = targetMap.getSource(SEARCH_HIGHLIGHT_SOURCE_ID);
    if (!source) return;
    source.setData({ type: 'FeatureCollection', features: [] });
}

function setSearchHighlight(targetMap, feature) {
    if (!targetMap) return;
    if (!feature) {
        clearSearchHighlight(targetMap);
        return;
    }
    ensureSearchHighlightLayers(targetMap);
    const source = targetMap.getSource(SEARCH_HIGHLIGHT_SOURCE_ID);
    if (!source) return;
    source.setData({
        type: 'FeatureCollection',
        features: [feature],
    });
}

function renderSearchResult(lon, lat, labelText, feature = null) {
    const targetMaps = isComparisonMode ? [mapBefore, mapAfter] : [map];
    const bounds = feature ? getFeatureBounds(feature) : null;
    const highlightPolygon = isPolygonFeature(feature);

    targetMaps.forEach((targetMap) => {
        if (!targetMap) return;

        setSearchHighlight(targetMap, highlightPolygon ? feature : null);

        if (bounds && highlightPolygon) {
            targetMap.fitBounds(bounds, {
                padding: 56,
                duration: 1200,
                maxZoom: Math.max(getZoomOnResult(), 16),
            });
        } else {
            targetMap.flyTo({
                center: [lon, lat],
                zoom: getZoomOnResult(),
                duration: 1200,
            });
        }
    });

    currentSearchCoords = [lon, lat];

    if (isComparisonMode) {
        const overlay = document.getElementById('search-markers-overlay');
        if (!overlay) return;

        const existingMarker = document.getElementById('search-marker-overlay');
        const existingPopup = document.getElementById('search-popup-overlay');
        if (existingMarker) existingMarker.remove();
        if (existingPopup) existingPopup.remove();

        const markerEl = document.createElement('div');
        markerEl.id = 'search-marker-overlay';
        markerEl.className = 'search-marker search-marker-overlay';
        overlay.appendChild(markerEl);
        searchMarkerOverlayEl = markerEl;

        const popupEl = document.createElement('div');
        popupEl.id = 'search-popup-overlay';
        popupEl.className = 'search-popup-overlay';
        popupEl.innerHTML = `
            <div class="popup-content">
                <div class="popup-row">
                    <span class="popup-label">Найдено</span>
                    <span class="popup-value">${labelText}</span>
                </div>
                <button class="popup-close">×</button>
            </div>
        `;

        const closeBtn = popupEl.querySelector('.popup-close');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                const marker = document.getElementById('search-marker-overlay');
                const popup = document.getElementById('search-popup-overlay');
                if (marker) marker.remove();
                if (popup) popup.remove();
                currentSearchCoords = null;
                searchMarkerOverlayEl = null;
                searchPopupOverlayEl = null;
                [mapBefore, mapAfter].forEach(clearSearchHighlight);
            });
        }

        overlay.appendChild(popupEl);
        searchPopupOverlayEl = popupEl;

        setTimeout(() => updateSearchMarkerPosition(), 100);
        return;
    }

    searchMarkers.forEach((marker) => marker && marker.remove());
    searchPopups.forEach((popup) => popup && popup.remove());
    searchMarkers = [];
    searchPopups = [];

    if (!map) return;

    // Для полигонов достаточно подсветки контура; пин оставляем для точек.
    if (!highlightPolygon) {
        const el = document.createElement('div');
        el.className = 'search-marker';

        const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
            .setLngLat([lon, lat])
            .addTo(map);
        searchMarkers.push(marker);
    }

    const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 25 })
        .setLngLat([lon, lat])
        .setHTML(`
            <div class="popup-content">
                <div class="popup-row">
                    <span class="popup-label">Найдено</span>
                    <span class="popup-value">${labelText}</span>
                </div>
            </div>
        `)
        .addTo(map);

    popup.on('close', () => {
        clearSearchHighlight(map);
    });

    searchPopups.push(popup);
}

function getGeocoderUrl() {
    if (searchConfig && searchConfig.geocoder_url) {
        return searchConfig.geocoder_url;
    }
    return 'https://pvz-map-backend.wildberries.ru/api/v2/map/geocode';
}

function buildGeocoderUrl(query, results = null) {
    const baseUrl = getGeocoderUrl();
    const url = new URL(baseUrl);
    url.searchParams.set('geocode', query);
    url.searchParams.set('lang', 'ru');

    if (results !== null) {
        url.searchParams.set('results', results);
    }

    if (searchConfig && searchConfig.geocoder_params) {
        for (const [key, value] of Object.entries(searchConfig.geocoder_params)) {
            url.searchParams.set(key, value);
        }
    }

    return url.toString();
}

async function searchGeojson(queryOverride = null) {
    const searchInput = document.getElementById('address-search');
    const query = queryOverride || (searchInput ? searchInput.value.trim() : '');

    hideSuggestions();

    if (!query) {
        alert('Введите значение для поиска');
        return;
    }

    const matches = findGeojsonMatches(query, 1);
    if (!matches.length) {
        alert('Ничего не найдено');
        return;
    }

    const bestMatch = matches[0];
    renderSearchResult(
        bestMatch.coords[0],
        bestMatch.coords[1],
        bestMatch.displayText,
        bestMatch.feature
    );
}

async function searchByGeocoder(addressOverride = null) {
    const searchInput = document.getElementById('address-search');
    const address = addressOverride || (searchInput ? searchInput.value : '');

    hideSuggestions();

    if (!address) {
        alert('Введите адрес');
        return;
    }

    try {
        const url = buildGeocoderUrl(address, 1);
        const response = await fetch(url);
        const data = await response.json();

        const members = data && data.response && data.response.GeoObjectCollection &&
            data.response.GeoObjectCollection.featureMember;

        if (!members || members.length === 0) {
            alert('Адрес не найден');
            return;
        }

        const pos = members[0].GeoObject.Point.pos;
        const coords = pos.split(' ').map(Number);
        const lon = coords[0];
        const lat = coords[1];

        renderSearchResult(lon, lat, address);
    } catch (error) {
        console.error('Geocoding error:', error);
        alert('Ошибка при поиске адреса');
    }
}

async function searchAddress(addressOverride = null) {
    if (isGeojsonSearchMode()) {
        return searchGeojson(addressOverride);
    }
    return searchByGeocoder(addressOverride);
}

async function showSuggestionsFromGeojson(query) {
    if (!query || query.length < 1) {
        hideSuggestions();
        return;
    }

    const suggestionsContainer = document.getElementById('address-search-suggestions');
    if (!suggestionsContainer) return;

    const matches = findGeojsonMatches(query, getMaxResults());
    if (!matches.length) {
        hideSuggestions();
        return;
    }

    suggestionsContainer.innerHTML = '';

    matches.forEach((item) => {
        const suggestionText = item.displayText;
        const row = document.createElement('div');
        row.className = 'address-search-suggestion-item';
        row.textContent = suggestionText;
        row.onclick = () => {
            const searchInput = document.getElementById('address-search');
            if (searchInput) searchInput.value = item.valueText;
            searchGeojson(item.valueText);
        };
        suggestionsContainer.appendChild(row);
    });

    suggestionsContainer.classList.add('visible');
}

async function showSuggestionsFromGeocoder(query) {
    if (!query || query.length < 3) {
        hideSuggestions();
        return;
    }

    const suggestionsContainer = document.getElementById('address-search-suggestions');
    if (!suggestionsContainer) return;

    try {
        const url = buildGeocoderUrl(query, getMaxResults());
        const response = await fetch(url);
        const data = await response.json();

        const members = data && data.response && data.response.GeoObjectCollection &&
            data.response.GeoObjectCollection.featureMember;

        if (!members || members.length === 0) {
            hideSuggestions();
            return;
        }

        const suggestions = members.slice(0, getMaxResults());
        suggestionsContainer.innerHTML = '';

        suggestions.forEach((member) => {
            const geoObject = member.GeoObject;
            const addressText =
                (geoObject.metaDataProperty && geoObject.metaDataProperty.GeocoderMetaData && geoObject.metaDataProperty.GeocoderMetaData.text) ||
                geoObject.name ||
                'Адрес не указан';

            const item = document.createElement('div');
            item.className = 'address-search-suggestion-item';
            item.textContent = addressText;
            item.onclick = () => {
                const searchInput = document.getElementById('address-search');
                if (searchInput) searchInput.value = addressText;
                searchByGeocoder(addressText);
            };
            suggestionsContainer.appendChild(item);
        });

        suggestionsContainer.classList.add('visible');
    } catch (error) {
        console.error('Suggestions error:', error);
        hideSuggestions();
    }
}

async function showSuggestions(query) {
    if (isGeojsonSearchMode()) {
        return showSuggestionsFromGeojson(query);
    }
    return showSuggestionsFromGeocoder(query);
}

function hideSuggestions() {
    const suggestionsContainer = document.getElementById('address-search-suggestions');
    if (suggestionsContainer) {
        suggestionsContainer.classList.remove('visible');
    }
}

const debouncedShowSuggestions = debounce(showSuggestions, 300);

document.addEventListener('DOMContentLoaded', function () {
    const searchInput = document.getElementById('address-search');
    if (!searchInput) return;

    searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchAddress();
        }
    });

    if (searchConfig && searchConfig.autocomplete) {
        searchInput.addEventListener('input', function (e) {
            const query = e.target.value.trim();
            const minLen = isGeojsonSearchMode() ? 1 : 3;
            if (query.length >= minLen) {
                debouncedShowSuggestions(query);
            } else {
                hideSuggestions();
            }
        });

        searchInput.addEventListener('blur', function () {
            setTimeout(hideSuggestions, 200);
        });

        searchInput.addEventListener('focus', function () {
            const query = searchInput.value.trim();
            const minLen = isGeojsonSearchMode() ? 1 : 3;
            if (query.length >= minLen) {
                debouncedShowSuggestions(query);
            }
        });
    }
});

        // Инициализация обработчиков событий
        function initEventHandlers() {
                        function map_parcelPopupHtml(props) {
                return `<div class="popup-content"><div class="popup-row"><span class="popup-label">📍 parcel</span><span class="popup-value">${value}</span></div></div>`;
            }
            map.on('mouseenter', 'parcel-layer', () => {
                map.getCanvas().style.cursor = 'pointer';
            });
            
            map.on('mouseleave', 'parcel-layer', () => {
                map.getCanvas().style.cursor = '';
            });
            const mapCombinedPopup = new maplibregl.Popup({
                closeButton: true,
                closeOnClick: false
            });
            const mapPopupLayers = ["parcel-layer"];
            const mapPopupLayerLabels = {};
            const mapPopupRenderers = {
                "parcel": map_parcelPopupHtml
            };
            const mapPopupHighlightSourceId = 'map-popup-highlight-source';
            const mapPopupHighlightFillLayerId = 'map-popup-highlight-fill';
            const mapPopupHighlightLineLayerId = 'map-popup-highlight-line';

            function ensureMapPopupHighlightLayers() {
                if (map.getSource(mapPopupHighlightSourceId)) return;

                map.addSource(mapPopupHighlightSourceId, {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: []
                    }
                });

                map.addLayer({
                    id: mapPopupHighlightFillLayerId,
                    type: 'fill',
                    source: mapPopupHighlightSourceId,
                    paint: {
                        'fill-color': '#ffd400',
                        'fill-opacity': 0.28
                    }
                });

                map.addLayer({
                    id: mapPopupHighlightLineLayerId,
                    type: 'line',
                    source: mapPopupHighlightSourceId,
                    paint: {
                        'line-color': '#ffd400',
                        'line-width': 3.5
                    }
                });
            }

            function clearMapPopupHighlight() {
                const source = map.getSource(mapPopupHighlightSourceId);
                if (!source) return;
                source.setData({
                    type: 'FeatureCollection',
                    features: []
                });
            }

            function setMapPopupHighlight(feature) {
                if (!feature) {
                    clearMapPopupHighlight();
                    return;
                }
                ensureMapPopupHighlightLayers();
                const source = map.getSource(mapPopupHighlightSourceId);
                if (!source) return;
                source.setData({
                    type: 'FeatureCollection',
                    features: [feature]
                });
            }

            mapCombinedPopup.on('close', () => {
                clearMapPopupHighlight();
            });

            map.on('click', (e) => {
                const features = map.queryRenderedFeatures(e.point, { layers: mapPopupLayers });
                const allFeaturesAtPoint = map.queryRenderedFeatures(e.point);
                if (!features || !features.length) {
                    clearMapPopupHighlight();
                    return;
                }

                const byLayer = new Map();
                features.forEach((feature) => {
                    if (!feature || !feature.layer || !feature.layer.id) return;
                    const layerId = feature.layer.id;
                    const layerName = layerId.endsWith('-layer') ? layerId.slice(0, -6) : layerId;
                    if (!mapPopupRenderers[layerName]) return;
                    if (!byLayer.has(layerName)) {
                        byLayer.set(layerName, feature);
                    }
                });

                if (byLayer.size === 0) {
                    clearMapPopupHighlight();
                    return;
                }

                const polygonFeature = allFeaturesAtPoint.find((feature) => {
                    if (!feature || !feature.geometry) return false;
                    if (!feature.layer || !feature.layer.id) return false;
                    if (feature.layer.id === mapPopupHighlightFillLayerId || feature.layer.id === mapPopupHighlightLineLayerId) return false;
                    const geomType = feature.geometry.type;
                    return geomType === 'Polygon' || geomType === 'MultiPolygon';
                });

                if (polygonFeature) {
                    setMapPopupHighlight(polygonFeature);
                } else {
                    clearMapPopupHighlight();
                }

                const sections = [];
                byLayer.forEach((feature, layerName) => {
                    const props = feature.properties || {};
                    const rawLayerTitle = mapPopupLayerLabels[layerName] || layerName;
                    const layerTitle = String(rawLayerTitle)
                        .replaceAll('&', '&amp;')
                        .replaceAll('<', '&lt;')
                        .replaceAll('>', '&gt;')
                        .replaceAll('"', '&quot;');
                    const layerHtml = mapPopupRenderers[layerName](props);
                    sections.push(`<div class="popup-layer-section"><div class="popup-row"><span class="popup-label">Слой</span><span class="popup-value">${layerTitle}</span></div>${layerHtml}</div>`);
                });

                mapCombinedPopup.setLngLat(e.lngLat)
                    .setHTML(sections.join('<hr/>'))
                    .addTo(map);

                if (false) {
                    const popupEl = mapCombinedPopup.getElement();
                    if (popupEl) {
                        popupEl.classList.add('popup--resizable');
                        const shellEl = popupEl.querySelector('.maplibregl-popup-content');
                        if (shellEl) shellEl.classList.add('popup-shell--resizable');
                    }
                }
            });
            // Двойной клик / правый клик для перехода в Яндекс.Карты
            map.on('dblclick', (e) => {
                openYandexMaps(e.lngLat.lng, e.lngLat.lat);
            });
            
            map.on('contextmenu', (e) => {
                e.preventDefault();
                openYandexMaps(e.lngLat.lng, e.lngLat.lat);
            });
        }

        // =========================================================================
        // Глобальные переменные и конфигурация
        // =========================================================================
        
        // Глобальные переменные
        let map;
        let mapBefore = null; // Левая карта (до)
        let mapAfter = null;  // Правая карта (после)
        let compare = null;   // Слайдер сравнения
        let searchMarkers = [];

        let mapConfig = null;
        let layersLoaded = false; // Флаг загрузки слоев
        let currentTileProvider = 'yandex'; // Текущий провайдер тайлов
        const isComparisonMode = false;
        const comparisonLeftLayers = [];
        const comparisonRightLayers = [];
        const searchConfig = {"geocoder_url": null, "geocoder_params": {}, "autocomplete": true, "zoom_on_result": 16, "search_mode": "geocoder", "search_fields": [], "search_layers": null, "max_results": 5};
        const embeddedParcelData = {"type": "FeatureCollection", "name": "parcel", "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}}, "features": [{"type": "Feature", "properties": {"cadastral_number": "77:02:0024002:42", "area_zu": 0.10092450025915761, "owner_category": "Физические лица", "generated_land_use": "открытые грунты/асфальт", "category_vri": "Гаражи", "restrictions": "ЛЭП <50%", "dev_prig_fin": "2 приоритет", "district": "Марьина Роща", "okrug": "СВАО", "in_mkad": true, "card_id": "B"}, "geometry": {"type": "Polygon", "coordinates": [[[37.6087279117595, 55.799306206330684], [37.608752943212046, 55.79890398628557], [37.60840197615662, 55.798896032289335], [37.6083616359581, 55.79929898425046], [37.6087279117595, 55.799306206330684]]]}}]};
        const use_compression = false;
        
        // Конфигурация карты
        const mapSettings = {
            center: [37.60855728958507, 55.79910111931001],
            zoom: 17
        };
        
        // Конфигурация провайдеров тайлов
        const tileProviders = {"yandex": {"name": "yandex", "url": "https://core-renderer-tiles.maps.yandex.net/tiles?l=map&x={x}&y={y}&z={z}&lang=ru_RU&projection=web_mercator&scale=4", "tileSize": 256, "minzoom": 0, "maxzoom": 18, "attribution": "Яндекс.Карты", "isOverlay": false, "defaultVisible": false, "defaultOpacity": 1.0, "paint": {"raster-saturation": -1}}};

                // Оптимизация памяти для неактивных вкладок (RAM + GPU)
        function initVisibilityOptimization() {
            document.addEventListener('visibilitychange', async () => {
                if (document.hidden) {
                    // Вкладка неактивна - освобождаем RAM и останавливаем рендеринг
                    if (map && layersLoaded) {
                        // 1. Останавливаем рендеринг
                        map.stop();
                        
                        // 2. Удаляем источники данных для освобождения RAM
                        const sourcesToRemove = ['parcel'];
                        sourcesToRemove.forEach(sourceId => {
                            if (map.getSource(sourceId)) {
                                // Удаляем все слои, связанные с этим источником
                                const style = map.getStyle();
                                if (style && style.layers) {
                                    style.layers
                                        .filter(layer => layer.source === sourceId)
                                        .forEach(layer => {
                                            try {
                                                if (map.getLayer(layer.id)) {
                                                    map.removeLayer(layer.id);
                                                }
                                            } catch (e) {
                                                // Слой уже удален или не существует
                                            }
                                        });
                                }
                                // Удаляем источник (освобождает RAM)
                                try {
                                    map.removeSource(sourceId);
                                } catch (e) {
                                    // Источник уже удален
                                }
                            }
                        });
                        
                        // 3. Скрываем canvas для освобождения GPU памяти
                        map.getCanvas().style.display = 'none';
                        
                        layersLoaded = false;
                        console.log('Карта приостановлена: RAM и GPU освобождены (вкладка неактивна)');
                    }
                } else {
                    // Вкладка активна - восстанавливаем данные и рендеринг
                    if (map && !layersLoaded) {
                        // 1. Показываем canvas
                        map.getCanvas().style.display = 'block';
                        
                        // 2. Перезагружаем данные (восстанавливаем в RAM)
                        await loadLayers();
                        layersLoaded = true;
                        
                        // 3. Обновляем карту
                        map.resize();
                        map.triggerRepaint();
                        
                        console.log('Карта возобновлена: данные перезагружены (вкладка активна)');
                    } else if (map && layersLoaded) {
                        // Данные уже загружены, просто обновляем отображение
                        map.getCanvas().style.display = 'block';
                        map.resize();
                        map.triggerRepaint();
                    }
                }
            });
        }
        
                // Оптимизированная функция для развертывания MULTIPOINT в отдельные точки
        // Использует асинхронную обработку порциями для избежания блокировки UI
        function explodeMultiPoint(geojson, callback) {
            const features = [];
            let processed = 0;
            const total = geojson.features.length;
            const chunkSize = 100; // Обрабатываем по 100 кластеров за раз
            
            function processChunk() {
                const end = Math.min(processed + chunkSize, total);
                
                for (let i = processed; i < end; i++) {
                    const feature = geojson.features[i];
                    if (feature.geometry.type === 'MultiPoint') {
                        // Разворачиваем MULTIPOINT в отдельные Point объекты
                        feature.geometry.coordinates.forEach(coord => {
                            features.push({
                                type: 'Feature',
                                geometry: {
                                    type: 'Point',
                                    coordinates: coord
                                },
                                properties: feature.properties
                            });
                        });
                    } else {
                        // Оставляем как есть для Point и других типов
                        features.push(feature);
                    }
                }
                
                processed = end;
                
                if (processed < total) {
                    // Продолжаем обработку в следующем кадре
                    setTimeout(processChunk, 0);
                } else {
                    // Обработка завершена
                    callback({
                        type: 'FeatureCollection',
                        features: features
                    });
                }
            }
            
            // Начинаем обработку
            processChunk();
        }
        
                async function loadLayers() {

                        // Встроенные данные parcel
            const parcelDataRaw = embeddedParcelData;
            
            // Проверяем наличие MULTIPOINT и разворачиваем если необходимо
            const parcelHasMultiPoint = parcelDataRaw && parcelDataRaw.features && 
                parcelDataRaw.features.some(f => f.geometry && f.geometry.type === 'MultiPoint');
            
            const parcelData = parcelHasMultiPoint ? await new Promise((resolve) => {
                explodeMultiPoint(parcelDataRaw, resolve);
            }) : parcelDataRaw;
            
            map.addSource('parcel', {
                type: 'geojson',
                data: parcelData
            });
            
            map.addLayer({
                id: 'parcel-layer',
                type: 'fill',
                source: 'parcel',
                paint: {
                'fill-color': '#1c32bd',
                'fill-opacity': 0.3,
                'fill-outline-color': "#1c32bd"
                }
            });
            
            console.log('Слой parcel добавлен на map');
        }
